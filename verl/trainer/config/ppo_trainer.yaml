data:
  tokenizer: null
  use_shm: False
  train_files: ~/data/rlhf/gsm8k/train.parquet
  val_files: ~/data/rlhf/gsm8k/test.parquet
  prompt_key: prompt
  reward_fn_key: data_source
  max_prompt_length: 512
  max_response_length: 512
  train_batch_size: 1024
  val_batch_size: null
  seed: 1  # RandomSampler seed; override explicitly for matched experimental arms.
  return_raw_input_ids: False  # This should be set to true when the tokenizer between policy and rm differs
  return_raw_chat: False
  return_full_prompt: False
  shuffle: True
  filter_overlong_prompts: False # for large-scale dataset, filtering overlong prompts could be timeconsuming. You cat set the filter_overlong_prompts_workers to use multiprocessing to speed up.
  filter_overlong_prompts_workers: 1
  truncation: error
  image_key: images
  video_key: videos
  trust_remote_code: False  # main_ppo will check this config to determine whether to use remote code for tokenizer
  apply_chat_template_kwargs: {}
  custom_cls:
      path: null
      name: null

actor_rollout_ref:
  hybrid_engine: True
  model:
    path: ~/models/deepseek-llm-7b-chat
    use_shm: False
    external_lib: null
    override_config: { }
    enable_gradient_checkpointing: True
    enable_activation_offload: False
    use_remove_padding: False
    lora_rank: 0  # Set to positive value to enable LoRA (e.g., 32)
    lora_alpha: 16  # LoRA scaling factor
    target_modules: all-linear  # all-linear or [q_proj,k_proj,v_proj,o_proj,gate_proj,up_proj,down_proj]
    use_liger: False
    use_fused_kernels: False
    attn_implementation: flash_attention_2
    trust_remote_code: False
  actor:
    strategy: fsdp  # [fsdp, fsdp2], This is for backward-compatibility
    use_adaptive_ppo_mini_batch_size: False
    ppo_mini_update_num: 10
    ppo_mini_batch_size: 256
    ppo_micro_batch_size: null # will be deprecated, use ppo_micro_batch_size_per_gpu
    ppo_micro_batch_size_per_gpu: null
    use_dynamic_bsz: False
    ppo_max_token_len_per_gpu: 16384 # n * ${data.max_prompt_length} + ${data.max_response_length}
    grad_clip: 1.0
    # pg_losses2 = -advantages * torch.clamp(ratio, 1 - cliprange_low, 1 + cliprange_high)
    clip_ratio: 0.2 # default value if clip_ratio_low and clip_ratio_high are not specified
    clip_ratio_low: 0.2
    clip_ratio_high: 0.2
    clip_ratio_c: 3.0 # lower bound of the value for Dual-clip PPO from https://arxiv.org/pdf/1912.09729
    loss_agg_mode: "token-mean" # / "seq-mean-token-sum" / "seq-mean-token-mean"
    entropy_coeff: 0.001
    entropy_control:
      enabled: False
      loss_coef: 0.0025
    use_invalid_action_penalty: True
    invalid_action_penalty_coef: 0.1
    use_kl_loss: False # True for GRPO
    use_torch_compile: True # False to disable torch compile
    kl_loss_coef: 0.001 # for grpo
    kl_loss_type: low_var_kl # for grpo
    ppo_epochs: 1
    shuffle: False
    ulysses_sequence_parallel_size: 1 # sp size
    checkpoint:
      contents: ['model', 'optimizer', 'extra']  # with 'hf_model' you can save whole model as hf format, now only use sharded model checkpoint to save space
    optim:
      lr: 1e-6
      lr_warmup_steps: -1 # Prioritized. Negative values mean delegating to lr_warmup_steps_ratio.
      lr_warmup_steps_ratio: 0.  # the total steps will be injected during runtime
      min_lr_ratio: 0.0   # only used with cosine lr scheduler, default to 0.0
      num_cycles: 0.5     # only used with cosine lr scheduler, default to 0.5
      warmup_style: constant  # select from constant/cosine
      total_training_steps: -1  # must be override by program
      weight_decay: 0.01
    fsdp_config:
      wrap_policy:
        # transformer_layer_cls_to_wrap: None
        min_num_params: 0
      param_offload: False
      optimizer_offload: False
      offload_policy: False # only for fsdp2, offload param\grad\optimizer during train
      reshard_after_forward: True # only for fsdp2, [True, False, int between 1 and fsdp_size]
      fsdp_size: -1
  ref:
    strategy: fsdp
    fsdp_config:
      param_offload: False
      reshard_after_forward: True # only for fsdp2, [True, False, int between 1 and fsdp_size]
      wrap_policy:
        # transformer_layer_cls_to_wrap: None
        min_num_params: 0
    use_torch_compile: ${actor_rollout_ref.actor.use_torch_compile}
    log_prob_micro_batch_size: null # will be deprecated, use log_prob_micro_batch_size_per_gpu
    log_prob_micro_batch_size_per_gpu: null
    log_prob_use_dynamic_bsz: ${actor_rollout_ref.actor.use_dynamic_bsz}
    log_prob_max_token_len_per_gpu: ${actor_rollout_ref.actor.ppo_max_token_len_per_gpu}
    ulysses_sequence_parallel_size: ${actor_rollout_ref.actor.ulysses_sequence_parallel_size} # sp size
  rollout:
    top_logprobs_num: 16
    name: vllm
    mode: sync # sync: LLM, async: AsyncLLM
    chat_scheduler: null # async chat scheduler, e.g examples.ppo_trainer.naive_chat_scheduler.NaiveChatCompletionScheduler
    temperature: 1.0
    top_k: -1 # 0 for hf rollout, -1 for vllm rollout
    top_p: 1
    use_fire_sampling: False # https://arxiv.org/abs/2410.21236
    prompt_length: ${data.max_prompt_length}  # not use for opensource
    response_length: ${data.max_response_length}
    # for vllm rollout
    dtype: bfloat16 # should align with FSDP
    gpu_memory_utilization: 0.5
    ignore_eos: False
    enforce_eager: True
    free_cache_engine: True
    load_format: dummy_dtensor  # safetensors (for huge model, and set use_shm=True); dummy_dtensor: randomly init model weight
    layered_summon: False # for huge model, layered summon can save memory (prevent OOM) but make it slower
    tensor_model_parallel_size: 2
    max_num_batched_tokens: 8192
    max_model_len: null
    max_num_seqs: 1024
    log_prob_micro_batch_size: null # will be deprecated, use log_prob_micro_batch_size_per_gpu
    log_prob_micro_batch_size_per_gpu: null
    log_prob_use_dynamic_bsz: ${actor_rollout_ref.actor.use_dynamic_bsz}
    log_prob_max_token_len_per_gpu: ${actor_rollout_ref.actor.ppo_max_token_len_per_gpu}
    disable_log_stats: True
    enable_chunked_prefill: True # may get higher throughput when set to True. When activated, Please increase max_num_batched_tokens or decrease max_model_len.
    # for hf rollout
    do_sample: True
    # number of responses (i.e. num sample times)
    n: 1 # > 1 for grpo
    engine_kwargs: # inference engine parameters
      vllm:
        swap_space: null # null means "use the engine default value" (usually 4 GB), setting it to, e.g., 32 means 32 GB
      sglang:
        attention_backend: null # null means use the engine default value, available options: flashinfer, triton, flashmla
    val_kwargs:
      # sampling parameters for validation
      top_k: -1 # 0 for hf rollout, -1 for vllm rollout
      top_p: 1.0
      temperature: 0
      n: 1
      do_sample: False # default eager for validation
    multi_turn:
      enable: False  # set to True for multi-turn tool interaction tasks; should set rollout.name to sglang as well
      max_turns: null  # null for no limit (default max_length // 3)
      tool_config_path: null  # null for no tool
      format: chatml  # chatml, more formats will be supported in the future

critic:
  rollout_n: ${actor_rollout_ref.rollout.n}
  strategy: fsdp # [fsdp, fsdp2]
  optim:
    lr: 1e-5
    lr_warmup_steps_ratio: 0.  # the total steps will be injected during runtime
    min_lr_ratio: null   # only useful for warmup with cosine
    warmup_style: constant  # select from constant/cosine
    total_training_steps: -1  # must be override by program
    weight_decay: 0.01
  model:
    path: ~/models/deepseek-llm-7b-chat
    use_shm: False
    tokenizer_path: ${actor_rollout_ref.model.path}
    override_config: { }
    external_lib: ${actor_rollout_ref.model.external_lib}
    enable_gradient_checkpointing: True
    enable_activation_offload: False
    use_remove_padding: False
    trust_remote_code: ${actor_rollout_ref.model.trust_remote_code}
    fsdp_config:
      param_offload: False
      optimizer_offload: False
      offload_policy: False # only for fsdp2, offload param\grad\optimizer during train
      reshard_after_forward: True # only for fsdp2, [True, False, int between 1 and fsdp_size]
      wrap_policy:
        # transformer_layer_cls_to_wrap: None
        min_num_params: 0
      fsdp_size: -1
    lora_rank: 0  # Set to positive value to enable LoRA (e.g., 32)
    lora_alpha: 16  # LoRA scaling factor
    target_modules: all-linear  # all-linear or [q_proj,k_proj,v_proj,o_proj,gate_proj,up_proj,down_proj]
  ppo_mini_batch_size: ${actor_rollout_ref.actor.ppo_mini_batch_size}
  ppo_micro_batch_size: null # will be deprecated, use ppo_micro_batch_size_per_gpu
  ppo_micro_batch_size_per_gpu: null
  forward_micro_batch_size: ${critic.ppo_micro_batch_size}
  forward_micro_batch_size_per_gpu: ${critic.ppo_micro_batch_size_per_gpu}
  use_dynamic_bsz: ${actor_rollout_ref.actor.use_dynamic_bsz}
  ppo_max_token_len_per_gpu: 32768 # (${actor_rollout_ref.actor.ppo_max_token_len_per_gpu}) * 2
  forward_max_token_len_per_gpu: ${critic.ppo_max_token_len_per_gpu}
  ulysses_sequence_parallel_size: 1 # sp size
  ppo_epochs: ${actor_rollout_ref.actor.ppo_epochs}
  shuffle: ${actor_rollout_ref.actor.shuffle}
  grad_clip: 1.0
  cliprange_value: 0.5
  loss_agg_mode: ${actor_rollout_ref.actor.loss_agg_mode}
  checkpoint:
    contents: ['model', 'optimizer', 'extra']  # with 'hf_model' you can save whole model as hf format, now only use sharded model checkpoint to save space

reward_model:
  enable: False
  strategy: fsdp
  model:
    input_tokenizer: ${actor_rollout_ref.model.path}  # set this to null if the chat template is identical
    path: ~/models/FsfairX-LLaMA3-RM-v0.1
    use_shm: False
    external_lib: ${actor_rollout_ref.model.external_lib}
    use_remove_padding: False
    use_fused_kernels: ${actor_rollout_ref.model.use_fused_kernels}
    trust_remote_code: False
    fsdp_config:
      wrap_policy:
        min_num_params: 0
      param_offload: False
      reshard_after_forward: True # only for fsdp2, [True, False, int between 1 and fsdp_size]
      fsdp_size: -1
  micro_batch_size: null # will be deprecated, use micro_batch_size_per_gpu
  micro_batch_size_per_gpu: null # set a number
  max_length: null
  ulysses_sequence_parallel_size: 1 # sp size
  use_dynamic_bsz: ${critic.use_dynamic_bsz}
  forward_max_token_len_per_gpu: ${critic.forward_max_token_len_per_gpu}
  reward_manager: episode
  launch_reward_fn_async: False # custom reward function executed async on CPU, during log_prob
  sandbox_fusion:
    url: null # faas url to run code in cloud sandbox
    max_concurrent: 64 # max concurrent requests to sandbox
custom_reward_function:
  path: null
  name: compute_score

algorithm:
  gamma: 1.0
  lam: 1.0
  adv_estimator: gae
  norm_adv_by_std_in_grpo: True
  group_by_agent_id: False # Whether to group by both uid and agent_id in group-aware advantage computation (Dr. MAS)
  # Detached rollout entropy only; never substitutes the Math LOTO baseline.
  entropy_credit:
    enable: False
    action_scale: 0.2
    trajectory_scale: 0.0
    trajectory_deadzone: 0.05
    multiplier_min: 0.8
    multiplier_max: 1.2
    final_multiplier_min: 0.8
    final_multiplier_max: 1.2
    relative_epsilon: 1.0e-12
    sparse:
      enable: False
      roles: ["Solver Agent"]
      min_group_size: 5
      shrinkage: 4.0
      min_coverage: 0.9
      min_residual: 0.002
      residual_mad_multiplier: 1.0
      min_entropy_spread: 1.0e-4
      min_delta_spread: 1.0e-4
      require_raw_direction: True
      correction_threshold: 0.8
      regression_threshold: 0.85
      eta: 0.04
      calibration_weight: response_tokens
      multiplier_min: 0.8
      multiplier_max: 1.2
  semantic_value:
    enable: False
    model_path: null
    revision: null
    initial_checkpoint: null
    initialization_mode: qualified
    require_pretrained: True
    allow_missing_resume: False
    device: cpu
    num_cpus: 1
    startup_timeout: 1800
    torch_dtype: float32
    attn_implementation: sdpa
    trust_remote_code: False
    max_length: 16384
    head_hidden_dim: 256
    dropout: 0.1
    learning_rate: 0.001
    weight_decay: 0.0001
    train_epochs: 5
    train_batch_size: 256
    replay_max_trajectories: 2048
    validation_fraction: 0.2
    holdout_salt: semantic-prefix-v1
    seed: 0
    min_train_trajectories: 64
    min_val_trajectories: 32
    min_val_per_class: 8
    min_train_questions: 8
    min_val_questions: 8
    min_val_auc: 0.55
    min_brier_improvement: 0.0
    candidate_brier_tolerance: 0.0
    max_ece: 0.15
    min_role_val_prefixes: 32
    disable_miscalibrated: True
    miscalibration_patience: 3
    disable_ready_when_insufficient: False
    cpu_num_threads: 1
  semantic_entropy_control:
    enabled: False
    fast_beta: 0.9
    slow_beta: 0.99
    cap_margin: 0.2
    cap_std_multiplier: 2.0
    risk_scale: 0.2
    trend_tolerance: 0.02
    trend_scale: 0.1
    min_calibration_actions: 8
    calibration_steps: 1
    min_group_actions: 2
    delta_deadzone: 0.02
    delta_scale: 0.1
    ramp_steps: 20
  # Critic-free TD/GAE over the global Search event chain. gamma/lam above are
  # used only after Search/Answer env actions; internal Verifier handoffs use
  # the coefficients below.
  team_event_gae:
    internal_gamma: 1.0
    internal_lam: 1.0
    include_kl_shaping: True
    normalize_advantages: True
    # Opt in explicitly. Missing/legacy configuration preserves the original
    # exact/depth/role value estimator and needs no IDF asset.
    value:
      mode: legacy_loto # legacy_loto | boundary_loto
      application: active # active | shadow (independent of agent_local.shadow)
      target: terminal_env_return
      expected_rollout_n: 8
      similarity: tfidf_cosine
      similarity_power: 4
      depth_window: 1
      cross_depth_decay: 0.5
      parent_alpha: 1.0
      question_parent_beta: 2.0
      verifier_same_route: True
      verifier_cross_depth_same_reason: True
      verifier_same_depth_same_reason: False
      nonterminal_answer: carry
      idf_path: null
      idf_sha256: null # optional expected file digest; actual digest is always recorded
      cache_size: 8192 # bounded text-vector cache; rewards are never cached across groups
      record_matched_peers: False
      empty_parent_fallback: question # carry is for historical offline parity only
      auxiliary_mode: keep_existing_local # env_only is the numeric-validation profile
      strict: True
    # Math-orchestra answer LOTO engine. Inert ("off") for Search runs; the
    # Math task dispatch resolves this node before the Search value node.
    math_value:
      mode: off # off | math_answer_loto
      target: terminal_env_success
      expected_rollout_n: 8
      expected_max_loop_num: 3
      parser_version: latest_box_token_v1
      feature_source: executed_action_text
      state_view: team_history
      matching: same_round_then_cross
      cross_round_decay: 0.5
      question_parent_strength: 2.0
      beta: 1.0
      verifier_post: carry
      auxiliary_mode: env_only
      strict: True
      cache_size: 8192 # bounded answer-parse cache; rewards/values never cached
      record_matched_peers: False
    # Separate post-advantage unique-event trace; never overwrites raw traces.
    credit_trace:
      enabled: False
      output_dir: null # defaults to ${trainer.default_local_dir}/credit_traces
      every_n_steps: 1
    # Same-agent semi-Markov GAE. "shadow" computes diagnostics only;
    # "blend" mixes raw Team/Local advantages before one normalization pass.
    agent_local:
      mode: "off"  # quote: YAML 1.1 otherwise interprets off as boolean False
      mix_alpha: 0.0
      local_lambda: 0.95
      local_internal_lambda: 1.0
  use_kl_in_reward: False
  kl_penalty: kl  # how to estimate kl divergence
  kl_ctrl:
    type: fixed
    kl_coef: 0.001
    horizon: 10000
    target_kl: 0.1
  use_pf_ppo: False
  pf_ppo:
    reweight_method: pow  # ["pow", "max_min", "max_random"]
    weight_pow: 2.0
  gigpo:
    step_advantage_w: 1.0
    mode: "mean_norm" # "mean_norm" or "mean_std_norm"
    enable_similarity: False # whether to use similarity-based anchor state grouping in GiGPO (supported for text-only tasks)
    similarity_thresh: 1.0 # similarity threshold for gigpo [0.0, 1.0]
  filter_groups: # DAPO from https://arxiv.org/abs/2503.14476
    enable: False
    max_num_gen_batches: 10

trainer:
  balance_batch: True
  total_epochs: 30
  total_training_steps: null
  project_name: verl_examples
  experiment_name: gsm8k
  logger: [ 'console', 'wandb' ]
  log_val_generations: 0
  rollout_data_dir: ${trainer.default_local_dir}/rollouts # All hybrid train trajectories, every step.
  validation_data_dir: ${trainer.default_local_dir}/validation # All hybrid validation trajectories, every batch.
  # Behavior-neutral raw event trace for offline Math/Search credit audits. Disabled
  # by default; records are dumped before adjust_batch/balance_batch.
  event_trace:
    enabled: False
    output_dir: null # defaults to ${trainer.default_local_dir}/event_traces
    source_revision: null # set to a commit, bundle tag, or checkpoint provenance label
    retriever_revision: null # index/corpus/retriever revision used by Search
    dataset_sha256: null # sha256 of the exact train/validation subset when available
    dump_train: True
    dump_val: True
    every_n_steps: 1
    include_token_ids: True
    include_rollout_log_probs: True
    require_rollout_log_probs: True
    require_generation_finish_reason: True
    include_offline_eval_info: False # includes ground_truth; keep False for hindsight scoring
  nnodes: 1
  n_gpus_per_node: 8
  agent_gpus_per_node: null # Actual Actor ranks per node: [15] or [7,8].
  save_freq: 10 # Global training updates; also save the final update.
  # auto: find the last ckpt to resume. If can't find, start from scratch
  resume_mode: disable # Explicit resume_path only; never infer a legacy checkpoint.
  resume_from_path: null
  val_only: False
  val_before_train: True
  test_freq: -1
  critic_warmup: 0
  default_hdfs_dir: null
  del_local_ckpt_after_load: False
  default_local_dir: checkpoints/${trainer.project_name}/${trainer.experiment_name}
  max_actor_ckpt_to_keep: null
  max_critic_ckpt_to_keep: null
  # The timeout for ray worker group to wait for the register center to be ready
  ray_wait_register_center_timeout: 300
  device: cuda

ray_init:
  address: null
  num_cpus: null # `None` means using all CPUs, which might cause hang if limited in systems like SLURM. Please set to a number allowed then.


agent: # only for multi-agent training
  multi_agent: True # True for multi-agent training, False for single-agent training
  agent_ids: ["Solver Agent","Verifier Agent"]
  model_ids: ["Qwen/Qwen3-4B","Qwen/Qwen3-4B"]  # "meta-llama/Llama-3.2-3B-Instruct" / "Qwen/Qwen3-4B" / "Qwen/Qwen2.5-1.5B-Instruct"
  model_sharing: False  # False: each agent has a unique model, True: share the same model across agents
  agent_specific_parameters: null # Optional: define agent-specific parameter overrides (only support actor_rollout_ref)
  #  Dictionary format - parameter paths mapped to lists of values per agent
  #   agent_specific_parameters.actor.optim.lr: [1e-6,1e-6,1e-7]
  #   agent_specific_parameters.actor.ppo_micro_batch_size_per_gpu: [4,8,8]
  orchestra_type: math
  use_agent_memory: False
  orchestra:
    math:
      max_loop_num: 3

env:
  env_name: alfworld/AlfredTWEnv
  seed: 0
  max_steps: 50
  history_length: 2
  # Search-only V/S/A protocol.  When enabled, agents receive a bounded,
  # factual query/evidence ledger instead of the raw multi-agent transcript.
  search_protocol:
    enabled: true
    max_history: 4
    query_char_limit: 512
    evidence_char_limit: 2400
    # Preserve legacy malformed-Verifier behavior; use "search" only as an
    # explicit robustness/diversity ablation.
    invalid_verifier_route: answer
    # The primary Search study updates three separate role policies.
    require_independent_models: true
  rollout:
    n: 1 # the group number of envs (for GRPO and GiGPO).
    val_n: 1 # the group number for validation (for pass@k and avg@k). Default to 1.

  sokoban:
    dim_room: [6, 6]
    num_boxes: 1
    search_depth: 30
    mode: tiny_rgb_array
  webshop:
    use_small: True
    human_goals: False
  search:
    log_requests: false
    search_url: "http://127.0.0.1:8000/retrieve" # also support multiple urls: ["http://127.0.0.1:8000/retrieve", "http://127.0.0.1:8001/retrieve"]
    topk: 3
    timeout: 60
